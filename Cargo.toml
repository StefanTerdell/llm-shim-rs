[package]
name = "llm-shim"
version = "0.1.0"
edition = "2024"
description = "Thin passthrough layer for LLM HTTP APIs with TPS throttling, token stats and reasoning remapping"
license = "MIT"
repository = "https://github.com/StefanTerdell/llm-shim-rs"
readme = "README.md"
keywords = ["llm", "openai", "anthropic", "streaming", "sse"]
categories = ["api-bindings", "web-programming::http-client"]

[dependencies]
arrayvec = { version = "0.7", features = ["serde"] }
async-stream = "0.3"
async-trait = "0.1"
bytes = "1"
derive_aliases = "0.4"
either = { version = "1", features = ["serde"] }
eventsource-stream = "0.2"
indexmap = { version = "2", features = ["serde"] }
itertools = "0.15"
reqwest = { version = "0.13", features = ["json", "multipart", "stream"] }
schemars = { version = "1", features = ["arrayvec07", "indexmap2", "preserve_order"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_with = { version = "3", default-features = false, features = ["std", "macros"] }
stefans-utils = { version = "0.12", features = ["secret-serialize-redacted"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["full"] }
url = { version = "2" }

[dev-dependencies]
axum = { version = "0.8", features = ["multipart"] }

[package]
name = "llm-shim"
version = "0.1.0"
edition = "2024"

[dependencies]
arrayvec = { version = "0.7.8", features = ["serde"] }
async-stream = "0.3.6"
async-trait = "0.1.89"
bytes = "1"
derive_aliases = "0.4.7"
either = { version = "1.16.0", features = ["serde"] }
eventsource-stream = "0.2"
indexmap = { version = "2.14.0", features = ["serde"] }
itertools = "0.15.0"
reqwest = { version = "0.13", features = ["json", "multipart", "stream"] }
schemars = { version = "1.2.1", features = ["arrayvec07", "indexmap2", "preserve_order"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["preserve_order"] }
serde_with = { version = "3", default-features = false, features = ["std", "macros"] }
stefans-utils = { version = "0.12.0", features = ["secret-serialize-redacted"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tokio-stream = { version = "0.1.18", features = ["full"] }
url = { version = "2" }

[dev-dependencies]
axum = { version = "0.8", features = ["multipart"] }
